name: CI/CD - EKS
on:
  pull_request:
  push:
    branches: [main, homologacao]
  workflow_dispatch:
concurrency:
  group: terraform-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'hom' }}
  TF_VAR_lab_role_arn: ${{ vars.LAB_ROLE_ARN }}
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.9" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: pwsh ./scripts/patch-eks-module-for-lab.ps1
      - run: terraform validate

  deploy:
    if: github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
      url: ${{ steps.endpoint.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.9" }
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=oficina/k8s/${TF_VAR_environment}.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: pwsh ./scripts/patch-eks-module-for-lab.ps1
      - run: terraform plan -lock-timeout=5m -out=tfplan
      - run: terraform apply -lock-timeout=5m -auto-approve tfplan
      - id: endpoint
        name: Registrar URL do API Gateway
        shell: bash
        run: |
          url="$(terraform output -raw api_gateway_url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Infraestrutura publicada"
            echo "- API Gateway: $url"
            echo "- Deployments: https://github.com/${GITHUB_REPOSITORY}/deployments"
          } >> "$GITHUB_STEP_SUMMARY"
